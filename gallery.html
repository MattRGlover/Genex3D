<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kandinsky Gallery - Desktop</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      margin: 0;
      padding: 0;
      color: #1a202c;
      min-height: 100vh;
      line-height: 1.6;
    }
    
    .header {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      padding: 1.5rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .header-content {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #2d3748;
      letter-spacing: -0.025em;
    }
    
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    
    .back-link:hover {
      background: rgba(102, 126, 234, 0.1);
      color: #5a67d8;
    }
    
    .gallery-container {
      max-width: 1600px;
      margin: 0 auto;
      padding: 2rem;
    }
    
    /* Pinterest-style Masonry Layout */
    #gallery-grid {
      columns: 5;
      column-gap: 20px;
      margin-top: 2rem;
    }
    
    @media (max-width: 1600px) {
      #gallery-grid { columns: 4; }
    }
    
    @media (max-width: 1200px) {
      #gallery-grid { columns: 3; }
      .gallery-container { padding: 1.5rem; }
    }
    
    @media (max-width: 900px) {
      #gallery-grid { columns: 2; }
      .gallery-container { padding: 1rem; }
    }
    
    .gallery-item {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      margin-bottom: 20px;
      break-inside: avoid;
      display: inline-block;
      width: 100%;
      position: relative;
    }
    
    .gallery-item:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    }
    
    .gallery-item::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(45deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 1;
    }
    
    .gallery-item:hover::before {
      opacity: 1;
    }
    
    .gallery-item canvas {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
    }
    
    .loading-placeholder {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
      border-radius: 16px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      font-size: 0.875rem;
    }
    
    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    
    .error-item {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 1rem;
      border-radius: 16px;
      text-align: center;
      font-size: 0.875rem;
    }
    /* Modal Styles */
    #redraw-modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: all 0.3s ease;
    }
    
    #redraw-modal.show {
      display: flex;
      opacity: 1;
    }
    
    .modal-content {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
      max-width: 90vw;
      max-height: 90vh;
      position: relative;
      overflow: hidden;
      transform: scale(0.9);
      transition: transform 0.3s ease;
    }
    
    #redraw-modal.show .modal-content {
      transform: scale(1);
    }
    
    .modal-header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
    }
    
    .modal-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #2d3748;
      margin: 0;
    }
    
    .close-button {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: #718096;
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 8px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
    }
    
    .close-button:hover {
      background: rgba(0, 0, 0, 0.05);
      color: #2d3748;
    }
    
    .modal-body {
      padding: 2rem;
      text-align: center;
    }
    
    #redraw-canvas {
      max-width: 100%;
      max-height: 70vh;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
    }
    
    .modal-footer {
      padding: 1.5rem 2rem;
      border-top: 1px solid #e2e8f0;
      background: #f8fafc;
      display: flex;
      gap: 1rem;
      justify-content: center;
    }
    
    .download-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
    }
    
    .download-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-content">
      <h1>Kandinsky Gallery</h1>
      <a href="index.html" class="back-link">
        ← Back to Canvas
      </a>
    </div>
  </div>
  
  <div class="gallery-container">
    <div id="gallery-grid"></div>
  </div>

  <!-- Modal for artwork preview -->
  <div id="redraw-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Kandinsky Composition</h3>
        <button class="close-button">&times;</button>
      </div>
      <div class="modal-body">
        <div id="redraw-canvas"></div>
      </div>
      <div class="modal-footer">
        <button id="download-hd" class="download-btn">
          📥 Standard Res (1:1)
        </button>
        <button id="download-4k" class="download-btn">
          🎨 Hi Res (4:1)
        </button>
      </div>
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
  
  <!-- Firebase Config -->
  <script src="config.js"></script>
  
  <!-- p5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
  
  <!-- Kandinsky Dependencies -->
  <script src="shapes.js"></script>
  <script src="gallery-renderer.js"></script>
  
  <!-- Desktop Gallery -->
  <script src="gallery-desktop.js"></script>

</body>
</html>
