<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kandinsky Gallery - Mobile</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
      padding: 0;
      background: #f7f7f7;
      min-height: 100vh;
      line-height: 1.6;
    }
    .container {
      max-width: 100%;
      margin: 0 auto;
      background: #fff;
      padding: 20px 0;
    }
    h1 {
      text-align: center;
      color: #111;
      margin: 20px 0 30px 0;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 15px;
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
    }
    .back-link:hover {
      color: #764ba2;
    }
    /* Mobile Pinterest-style Masonry Layout */
    #gallery-grid {
      columns: 2;
      column-gap: 12px;
      margin-bottom: 20px;
      padding: 0 8px;
    }
    
    @media (max-width: 480px) {
      #gallery-grid {
        columns: 1;
        column-gap: 0;
        padding: 0 4px;
      }
    }
    
    @media (min-width: 600px) {
      #gallery-grid {
        columns: 3;
        column-gap: 16px;
        padding: 0 12px;
      }
    }
    .gallery-item {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      margin-bottom: 12px;
      break-inside: avoid;
      display: inline-block;
      width: 100%;
      position: relative;
    }
    
    .gallery-item::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(45deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 1;
      border-radius: 16px;
    }
    /* Pinterest-style dynamic sizing based on aspect ratio */
    .gallery-item.portrait {
      /* Mobile/vertical compositions - emphasize height */
      box-shadow: 0 2px 8px rgba(103, 126, 234, 0.15), 0 1px 3px rgba(0, 0, 0, 0.12);
    }
    .gallery-item.landscape {
      /* Desktop/horizontal compositions - wider appearance */
      box-shadow: 0 2px 8px rgba(240, 147, 251, 0.15), 0 1px 3px rgba(0, 0, 0, 0.12);
    }
    .gallery-item.square {
      /* Square-ish compositions - balanced */
      box-shadow: 0 2px 8px rgba(79, 172, 254, 0.15), 0 1px 3px rgba(0, 0, 0, 0.12);
    }
    .gallery-item canvas {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
      position: relative;
      z-index: 0;
    }
    
    .loading-placeholder {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
      border-radius: 16px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      font-size: 0.8rem;
    }
    
    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    
    .error-item {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 1rem;
      border-radius: 16px;
      text-align: center;
      font-size: 0.875rem;
      margin: 8px;
    }
    .gallery-item:active {
      transform: scale(0.98);
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    
    .gallery-item:active::before {
      opacity: 1;
    }
    
    @media (hover: hover) {
      .gallery-item:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      }
      
      .gallery-item:hover::before {
        opacity: 1;
      }
    }
    .device-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
      color: white;
      backdrop-filter: blur(10px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      z-index: 5;
    }
    .mobile-badge {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .desktop-badge {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }
    .unknown-badge {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    }
    /* Mobile Modal Styles */
    #redraw-modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      padding: 20px;
      opacity: 0;
      transition: all 0.3s ease;
    }
    #redraw-modal.show {
      display: flex;
      opacity: 1;
    }
    .modal-content {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
      max-width: 95vw;
      max-height: 90vh;
      position: relative;
      overflow: hidden;
      transform: scale(0.9);
      transition: transform 0.3s ease;
    }
    
    #redraw-modal.show .modal-content {
      transform: scale(1);
    }
    
    .modal-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
    }
    
    .modal-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #2d3748;
      margin: 0;
    }
    
    .modal-body {
      padding: 1.5rem;
      text-align: center;
      max-height: 60vh;
      overflow: auto;
    }
    
    #redraw-canvas {
      max-width: 100%;
      max-height: calc(85vh - 120px);
      width: auto;
      height: auto;
    }
    .close-button {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: #718096;
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 8px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      -webkit-tap-highlight-color: transparent;
    }
    .close-button:hover {
      background: rgba(0, 0, 0, 0.05);
      color: #2d3748;
    }
    .close-button:active {
      background: rgba(0, 0, 0, 0.05);
      color: #2d3748;
    }
    #download-controls {
      margin-top: 12px;
      text-align: center;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .download-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      flex: 1;
      min-height: 44px; /* iOS touch target minimum */
    }
    .download-btn:active {
      transform: scale(0.98);
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
    }
    
    @media (hover: hover) {
      .download-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
      }
    }
    /* Responsive adjustments */
    @media (max-width: 480px) {
      .container {
        padding: 10px 0;
      }
      
      h1 {
        font-size: 20px;
        margin: 15px 0 20px 0;
      }
      
      .back-link {
        font-size: 13px;
        margin-bottom: 10px;
      }
      
      .modal-body {
        padding: 1rem;
      }
      
      .modal-footer {
        padding: 1rem;
      }
      
      .download-btn {
        font-size: 0.85rem;
        padding: 0.65rem 1rem;
      }
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
      font-size: 16px;
    }
    .error {
      text-align: center;
      padding: 40px;
      color: #e74c3c;
      font-size: 16px;
    }
    
    /* Mobile-specific optimizations */
    @media (max-width: 480px) {
      .container {
        padding: 10px;
        border-radius: 10px;
      }
      h1 {
        font-size: 20px;
        margin-bottom: 15px;
      }
      #gallery-grid {
        gap: 8px;
      }
      #redraw-container {
        padding: 10px;
        max-width: 98vw;
        max-height: 98vh;
      }
      #redraw-canvas {
        max-height: calc(80vh - 100px);
      }
      .download-btn {
        padding: 6px 12px;
        font-size: 11px;
        min-width: 100px;
      }
      #download-controls {
        gap: 6px;
      }
    }
    
    /* Touch-friendly interactions */
    @media (hover: none) and (pointer: coarse) {
      .gallery-item:hover {
        transform: none;
      }
      .gallery-item:active {
        transform: scale(0.98);
        opacity: 0.8;
      }
      .download-btn:hover {
        transform: none;
      }
      .download-btn:active {
        transform: scale(0.95);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-link">← Back to Canvas</a>
    <h1>Kandinsky Gallery</h1>
    <div id="gallery-grid" class="loading">Loading compositions...</div>
  </div>

  <!-- Modal for redrawing artwork -->
  <!-- Mobile Modal for artwork preview -->
  <div id="redraw-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Kandinsky Composition</h3>
        <button class="close-button">&times;</button>
      </div>
      <div class="modal-body">
        <div id="redraw-content"></div>
      </div>
      <div class="modal-footer">
        <button id="download-standard" class="download-btn">
          📥 Standard Res (1:1)
        </button>
        <button id="download-hires" class="download-btn">
          🎨 Hi Res (4:1)
        </button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>
  <script src="config.js?v=10"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.js"></script>
  <script src="gallery-renderer.js?v=10"></script>
  <script src="gallery-mobile.js?v=10"></script>
</body>
</html>
